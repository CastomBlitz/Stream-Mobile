‎name: Build APK
‎on: [push]  # Срабатывает при каждом пуше
‎
‎jobs:
‎  build:
‎    runs-on: ubuntu-latest  # Виртуальная машина GitHub
‎
‎    steps:
‎uses: actions/checkout@v4  # Скачивает ваш код
‎
‎name: Set up JDK 17
‎        uses: actions/setup-java@v3
‎        with:
‎          distribution: temurin
‎          java-version: '17'
‎
‎name: Set up Gradle cache
‎        uses: gradle/actions/cache-action@v3  # Кэширует сборку, чтобы было быстрее
‎
‎name: Assemble Debug APK
‎        run: ./gradlew :app:assembleDebug  # Сама сборка
‎
‎name: Upload APK artifact
‎        uses: actions/upload-artifact@v4
‎        with:
‎          name: StreamSettings-debug-apk
‎          path: app/build/outputs/apk/debug/app-debug.apk
‎
