        run: gradle assembleDebug --no-daemon
        working-directory: /tmp/proj
      - uses: actions/upload-artifact@v4
        with:
          name: ScreenStream-debug-apk
          path: /tmp/proj/app/build/outputs/apk/debug/*.apk
